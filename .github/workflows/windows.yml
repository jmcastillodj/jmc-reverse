name: Windows build

on:
  push:
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Visual Studio, x64)
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run the test suites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./build/Release/JMCTests.exe
          if ($LASTEXITCODE -ne 0) { throw "JMCTests failed" }
          ./build/Release/JMCPluginTests.exe
          if ($LASTEXITCODE -ne 0) { throw "JMCPluginTests failed" }

      - name: Load the finished VST3 through a VST3 host
        shell: pwsh
        run: |
          $bundle = "build/JMCReverse_artefacts/Release/VST3/JMC REVERSE.vst3"
          if (-not (Test-Path $bundle)) { throw "VST3 bundle not found" }
          ./build/Release/jmc_hostcheck.exe $bundle
          if ($LASTEXITCODE -ne 0) { throw "hostcheck failed" }

      - name: Package
        shell: pwsh
        run: |
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(JMCReverse VERSION ([0-9.]+)' | Select-Object -First 1).Matches.Groups[1].Value
          $name = "JMC REVERSE $ver Windows x64"
          $out = "dist/$name"
          New-Item -ItemType Directory -Force -Path "$out/docs" | Out-Null
          Copy-Item "build/JMCReverse_artefacts/Release/VST3/JMC REVERSE.vst3" "$out/" -Recurse
          Copy-Item release/windows/install.bat, release/windows/uninstall.bat, release/windows/INSTALL.md, release/LICENSE-NOTICE.txt, README.md "$out/"
          Copy-Item docs/PARAMETERS.md, docs/TESTED.md, docs/LIMITATIONS.md "$out/docs/"
          Compress-Archive -Path "$out" -DestinationPath "dist/$name.zip" -Force
          (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash | Out-File "dist/$name.zip.sha256"
          echo "ZIP=dist/$name.zip" >> $env:GITHUB_ENV

      - name: Upload the zip
        uses: actions/upload-artifact@v4
        with:
          name: JMC-REVERSE-Windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
